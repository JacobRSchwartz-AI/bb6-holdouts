<title>The Odometer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ground:#0b0e11; --face:#111519; --well:#080a0d;
  --rule:#1e252b; --rule2:#2c353d;
  --ink:#e9edf0; --ink2:#8b98a2; --ink3:#525d66;
  --brass:#d6a94f; --brass2:#8f7233; --brass3:#54431e;
  --verd:#5f9e8e; --verd2:#39605a;
  --head:#a8d8ff; --halt:#e2543a;
  --sans:Bahnschrift,'DIN Alternate','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Mono',Consolas,'SF Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; -webkit-font-smoothing:antialiased;
  display:grid; grid-template-rows:auto 1fr auto; gap:0;
  height:100dvh; overflow:hidden;
}

/* ---------- header ---------- */
header{
  display:flex; align-items:baseline; gap:20px; flex-wrap:wrap;
  padding:16px 26px 13px; border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,var(--face),var(--ground));
}
h1{
  margin:0; font-size:23px; font-weight:600; letter-spacing:.055em;
  text-transform:uppercase; line-height:1;
}
.eyebrow{
  font-size:9.5px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--ink3); align-self:center;
}
#code{
  margin-left:auto; font-family:var(--mono); font-size:11.5px;
  letter-spacing:.02em; color:var(--ink2); white-space:nowrap;
}
#code b{color:var(--brass);font-weight:400}
#code .hole{color:var(--halt)}

/* ---------- stage ---------- */
main{padding:16px 26px 10px; min-height:0; display:flex}
#well{
  flex:1; position:relative; min-height:0;
  background:var(--well); border:1px solid var(--rule); border-radius:2px;
  box-shadow:inset 0 1px 0 #ffffff08, inset 0 0 42px #0009;
}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block}
#halt{
  position:absolute; inset:0; pointer-events:none; opacity:0;
  transition:opacity .5s; border-radius:2px;
  box-shadow:inset 0 0 0 1px var(--halt), inset 0 0 60px #e2543a22;
}
#halt.on{opacity:1}
#halt span{
  position:absolute; left:0; right:0; bottom:0; padding:12px 18px;
  background:#20100c; border-top:1px solid var(--halt);
  font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:#e88b73;
}
#halt span b{color:#f2a08c; font-weight:600; letter-spacing:.3em}

/* ---------- console ---------- */
footer{padding:4px 26px 16px; border-top:1px solid var(--rule); background:var(--face)}
.console{display:grid; grid-template-columns:auto 1fr auto; gap:0 20px; align-items:center; padding-top:12px}

#play{
  grid-row:span 2; width:46px; height:46px; padding:0; cursor:pointer;
  background:#0e1216; border:1px solid var(--rule2); border-radius:50%;
  color:var(--brass); display:grid; place-items:center;
  transition:border-color .15s, background .15s;
}
#play:hover{border-color:var(--brass2); background:#141a20}
#play svg{width:15px;height:15px;fill:currentColor}

.rail{position:relative; height:26px; display:flex; align-items:center}
.rail .track{position:absolute; left:0; right:0; height:1px; background:var(--rule2)}
#whenRail{cursor:ew-resize; touch-action:none}
#whenTicks{position:absolute; left:0; right:0; height:26px; opacity:.5}
#whenKnob{
  position:absolute; width:2px; height:16px; background:var(--brass);
  box-shadow:0 0 7px #d6a94f88; transform:translateX(-1px);
}
#zoomRail{cursor:pointer}
.det{
  position:absolute; transform:translateX(-50%); display:grid; justify-items:center;
  gap:5px; font-size:9px; letter-spacing:.19em; text-transform:uppercase;
  color:var(--ink3); user-select:none; transition:color .2s;
}
.det i{display:block; width:1px; height:7px; background:var(--rule2); transition:background .2s}
.det.on{color:var(--brass)}
.det.on i{background:var(--brass); box-shadow:0 0 6px #d6a94f88; height:10px}

.readout{
  grid-column:3; font-family:var(--mono); font-size:11.5px; color:var(--ink2);
  font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;
}
.readout b{color:var(--ink); font-weight:400}
#caption{
  grid-column:2; font-size:12px; color:var(--ink3); letter-spacing:.02em;
  padding-top:2px; min-height:17px;
}
#caption em{color:var(--brass2); font-style:normal}

.foot{
  display:flex; gap:18px; flex-wrap:wrap; align-items:baseline;
  margin-top:14px; padding-top:11px; border-top:1px solid var(--rule);
  font-size:10px; letter-spacing:.05em; color:var(--ink3);
}
.foot a{color:var(--ink3); text-decoration:none; border-bottom:1px solid var(--rule2)}
.foot a:hover{color:var(--brass)}
.foot .sp{margin-left:auto}
:focus-visible{outline:1px solid var(--brass); outline-offset:2px}

@media (max-width:760px){
  header{padding:13px 16px 11px} main{padding:12px 16px 8px} footer{padding:4px 16px 13px}
  #code{margin-left:0; font-size:10px; white-space:normal}
  h1{font-size:19px}
  .console{grid-template-columns:auto 1fr; gap:0 14px}
  .readout{grid-column:1/-1; text-align:left; padding-top:8px}
  #caption{grid-column:1/-1}
}
</style>

<header>
  <h1>The Odometer</h1>
  <span class="eyebrow">BB(6) &middot; six states &middot; proven to halt</span>
  <span id="code"></span>
</header>

<main>
  <div id="well">
    <canvas id="cv"></canvas>
    <div id="halt"><span><b>halt</b> &nbsp; 3·2<sup>279</sup> sweeps &nbsp;·&nbsp; one block left, three short of a wheel</span></div>
  </div>
</main>

<footer>
  <div class="console">
    <button id="play" aria-label="play"><svg id="playIcon" viewBox="0 0 16 16"><path d="M3 1.5 14 8 3 14.5Z"/></svg></button>

    <div class="rail" id="whenRail" role="slider" tabindex="0" aria-label="when">
      <div class="track"></div><canvas id="whenTicks"></canvas><div id="whenKnob"></div>
    </div>
    <div class="readout" id="ro"></div>

    <div class="rail" id="zoomRail" role="slider" tabindex="0" aria-label="zoom"></div>
    <div id="caption"></div>
  </div>

  <div class="foot">
    <span>Jacob Schwartz &amp; Claude Fable 5</span>

    <span class="sp"><a href="https://github.com/JacobRSchwartz-AI/bb6-holdouts">proof</a></span>
  </div>
</footer>

<script>
// The Odometer engine: exact raw simulator + exact abstract orbit.
// Shared verbatim between viz/index.html and the Node test harness.
// Ground truth mirrors tools/ledger.mjs and coq/OdometerDip.v.
'use strict';
(function () {

const CODE = '1RB1LC_1RC1RE_1LD1LF_---0LE_1RB0RB_0LF1LA';
const STATES = 'ABCDEF';

function parseMachine(code) {
  return code.split('_').map((row) => [row.slice(0, 3), row.slice(3, 6)].map((t) =>
    t === '---' ? null : { w: +t[0], d: t[1] === 'R' ? 1 : -1, n: t.charCodeAt(2) - 65 }));
}

// ---- raw cell-level simulator ----
function makeSim(code) {
  const M = parseMachine(code);
  let size = 1 << 16, off = size >> 1;
  let tape = new Int8Array(size);
  const sim = { head: off, q: 0, steps: 0, min: off, max: off, halted: false, off: () => off, tape: () => tape };
  function grow() {
    const nsize = size * 2, ntape = new Int8Array(nsize), shift = size >> 1;
    ntape.set(tape, shift);
    tape = ntape; sim.head += shift; sim.min += shift; sim.max += shift; off += shift; size = nsize;
  }
  sim.run = function (n, onStep) {
    let { head, q, steps } = sim;
    let min = sim.min, max = sim.max;
    for (let i = 0; i < n; i++) {
      const tr = M[q][tape[head]];
      if (!tr) { sim.halted = true; break; }
      tape[head] = tr.w;
      if (head < min) min = head;
      if (head > max) max = head;
      head += tr.d; q = tr.n; steps++;
      if (head < 8 || head >= size - 8) {
        sim.head = head; sim.q = q; sim.steps = steps; sim.min = min; sim.max = max;
        grow();
        ({ head, q, steps, min, max } = sim);
      }
      if (onStep && onStep(head, q, steps, tape, min, max, off)) break;
    }
    sim.head = head; sim.q = q; sim.steps = steps; sim.min = min; sim.max = max;
    return sim;
  };
  // cells left-to-right over the written extent, as 0/1, plus head offset within it
  sim.snapshot = function () {
    const lo = Math.min(sim.min, sim.head), hi = Math.max(sim.max, sim.head);
    return { cells: Array.from(tape.slice(lo, hi + 1)), head: sim.head - lo, q: sim.q, steps: sim.steps };
  };
  return sim;
}

// ---- glyphs (coq/OdometerDip.v) ----
// Raw spellings, left-to-right on the tape; value bits reversed.
const GRAW = { O: [0, 1, 0, 1], e: [0, 1, 1, 1], a: [1, 1, 0, 1], f: [1, 1, 1, 1] };
const TOGGLE = { O: 'f', f: 'O', e: 'a', a: 'e' };
// The inward rule table (the census, sealed over 100M raw steps).
const INSTEP = {
  F: { e: ['e', 'F'], f: ['f', 'A'], O: ['e', 'E'], a: ['f', 'E'] },
  A: { O: ['f', 'C'], f: ['f', 'C'], e: ['a', 'E'], a: ['a', 'E'] },
  C: { a: ['a', 'C'], f: ['f', 'F'], O: ['f', 'E'], e: ['f', 'D'] },
  D: { O: ['e', 'Cr'], a: ['f', 'Cr'], e: ['O', 'Cr'] },
};
const INWARD = (s) => s === 'F' || s === 'A' || s === 'C' || s === 'D';

// One dip: enter at W[0] (the separator end) in state F.
// W is a string over "Oeaf" in walk order (index 0 = rightmost on tape).
// Returns {out} | {dies:true} | {fail}; with trace=true also returns the
// exact walk as ops for animation:
//   {t:'in', i, s, g, g2, s2}   head crosses cell i inward, rewriting it
//   {t:'refl', i, s, g, g2}     head reflects at cell i, rewriting it
//   {t:'bounce', i}             Cr bounce: turns back inward at cell i
//   {t:'out', i, g, g2}         out-pass toggles cell i
//   {t:'die', i, s}             walk falls off the deep end (i = W.length)
function dip(Wstr, trace) {
  const deep = Wstr.split('');
  let s = 'F', di = 0;
  const shallow = [];
  const ops = trace ? [] : null;
  let fuel = 12 * deep.length + 60;
  while (fuel-- > 0) {
    if (s === 'E') {
      const out = deep.slice(di);
      for (let k = 0; k < shallow.length; k++) {
        const g = shallow[k];
        out.unshift(TOGGLE[g]);
        if (ops) ops.push({ t: 'out', i: shallow.length - 1 - k, g, g2: TOGGLE[g] });
      }
      return { out: out.join(''), ops };
    }
    if (s === 'Cr') {
      if (shallow[0] === 'f') { if (ops) ops.push({ t: 'bounce', i: di - 1 }); s = 'F'; continue; }
      return { fail: 'Cr without f', ops };
    }
    if (di >= deep.length) {
      if (ops) ops.push({ t: 'die', i: di, s });
      return s === 'C' ? { dies: true, ops } : { fail: 'falloff ' + s, ops };
    }
    const g = deep[di], tr = INSTEP[s] && INSTEP[s][g];
    if (!tr) return { fail: 'no rule ' + s + '/' + g, ops };
    const g2 = tr[0], s2 = tr[1];
    if (INWARD(s2)) {
      if (ops) ops.push({ t: 'in', i: di, s, g, g2, s2 });
      shallow.unshift(g2); di++;
    } else {
      if (ops) ops.push({ t: 'refl', i: di, s, g, g2 });
      deep[di] = g2;
    }
    s = s2;
  }
  return { fail: 'fuel', ops };
}

// ---- the counter encoding (tools/ledger.mjs) ----
// gcells rows (index = 4-bit value), walk order [bit; winlo; winhi]
const GCELLS = ['OOO', 'fOO', 'OeO', 'feO', 'Oae', 'fae', 'Ofe', 'ffe',
  'OOa', 'fOa', 'Oea', 'fea', 'Oaf', 'faf', 'Off', 'fff'];
const CELL_VAL = new Map(GCELLS.map((s, i) => [s, i]));

// maximal-G parse of W = "fO" + G cells of 3 glyphs + T
function parseSpell(W) {
  if (W[0] !== 'f' || W[1] !== 'O') return null;
  let G = 0, v = 0n;
  while (2 + 3 * (G + 1) <= W.length) {
    const b = CELL_VAL.get(W.slice(2 + 3 * G, 2 + 3 * G + 3));
    if (b === undefined) break;
    v += BigInt(b) << BigInt(4 * G);
    G++;
  }
  return { G, v, T: W.slice(2 + 3 * G) };
}

function setSpell(W, G, v) {
  let out = W.slice(0, 2);
  for (let g = 0; g < G; g++) out += GCELLS[Number((v >> BigInt(4 * g)) & 15n)];
  return out + W.slice(2 + 3 * G);
}

// ---- the ledger: fast-forward the whole orbit, base to death ----
// Returns every carry-overflow event (the 549 vm_compute lemmas of
// OdometerLedger.v) plus the death. Exact; runs in milliseconds.
function enumerate(W_BASE, maxEvents) {
  let W = W_BASE, nu = 0n;
  const events = [];
  let death = null;
  while (!death && events.length < (maxEvents || 100000)) {
    const p = parseSpell(W);
    if (!p) return { fail: 'unparseable at nu=' + nu, events };
    const cap = 1n << BigInt(4 * p.G);
    const span = cap - 1n - p.v;
    if (span > 0n) { W = setSpell(W, p.G, cap - 1n); nu += span; }
    const before = W;
    const r = dip(W);
    if (r.dies) { death = { nu: nu + 1n, dying: before }; break; }
    if (r.fail) return { fail: r.fail + ' at nu=' + nu, events };
    if (r.out[0] !== 'O') return { fail: 'bad separator at nu=' + nu, events };
    W = 'f' + r.out.slice(1);
    nu += 1n;
    events.push({ nuAfter: nu, G: p.G, before, after: W });
  }
  return { events, nuDeath: death && death.nu, dying: death && death.dying };
}

// Exact W after nu completed sweeps past the base anchor, for ANY
// nu in [0, nuDeath-1]. O(log #events).
function stateAt(nu, W_BASE, ledger) {
  const ev = ledger.events;
  if (nu <= 0n) return W_BASE;
  if (ledger.nuDeath && nu >= ledger.nuDeath) nu = ledger.nuDeath - 1n;
  let lo = 0, hi = ev.length - 1, k = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (ev[mid].nuAfter <= nu) { k = mid; lo = mid + 1; } else hi = mid - 1;
  }
  const W0 = k < 0 ? W_BASE : ev[k].after;
  const nu0 = k < 0 ? 0n : ev[k].nuAfter;
  if (nu === nu0) return W0;
  const p = parseSpell(W0);
  return setSpell(W0, p.G, p.v + (nu - nu0));
}

// ---- anchors at raw level (coq/OdometerDip.v `anchor`) ----
// Tape left-to-right: deepest glyph first ... W[0] last, then n e's,
// then the O edge, then the head (state C) on blank, facing right.
function spellAnchor(Wstr, n) {
  const cells = [];
  for (let i = Wstr.length - 1; i >= 0; i--) cells.push(...GRAW[Wstr[i]]);
  for (let k = 0; k < n; k++) cells.push(...GRAW.e);
  cells.push(...GRAW.O);
  return { cells, head: cells.length, q: 2 };
}

// Seed a raw simulator directly at anchor(W, n).
function simFromAnchor(code, Wstr, n) {
  const sim = makeSim(code);
  const a = spellAnchor(Wstr, n);
  const tape = sim.tape(), base = sim.off() - a.cells.length;
  for (let i = 0; i < a.cells.length; i++) tape[base + i] = a.cells[i];
  sim.head = sim.off(); sim.q = a.q; sim.min = base; sim.max = sim.off() - 1;
  return sim;
}

// Parse a raw snapshot back into anchor form: W + tail length. Null if
// the written tape is not currently an anchor.
const GKEY = { '0101': 'O', '0111': 'e', '1101': 'a', '1111': 'f' };
function tapeToW(snap) {
  const cells = snap.cells.slice(0, snap.head);
  if (snap.q !== 2 || cells.length % 4) return null;
  const gs = [];
  for (let i = 0; i < cells.length; i += 4) {
    const g = GKEY[cells.slice(i, i + 4).join('')];
    if (!g) return null;
    gs.push(g);
  }
  if (gs[gs.length - 1] !== 'O') return null;
  let n = 0, j = gs.length - 2;
  while (j >= 0 && gs[j] === 'e') { n++; j--; }
  return { W: gs.slice(0, j + 1).reverse().join(''), n };
}

// Run until the next true anchor (candidate frontier moments that don't
// parse — edge staging — are skipped). Null on budget exhaustion or halt.
function runToAnchor(sim, budget) {
  let remaining = budget;
  while (remaining > 0) {
    let hit = false;
    const before = sim.steps;
    sim.run(remaining, (head, q, steps, tape, min, max) =>
      (q === 2 && head > max && tape[head] === 0 && (hit = true)));
    remaining -= sim.steps - before;
    if (!hit || sim.halted) return null;
    const p = tapeToW(sim.snapshot());
    if (p) return p;
  }
  return null;
}

// ---- formatting ----
function bigFmt(n) {
  const s = n.toString();
  if (s.length <= 15) return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return s[0] + '.' + s.slice(1, 4) + '×10^' + (s.length - 1);
}
function log2Big(n) {
  if (n <= 0n) return 0;
  const s = n.toString(2);
  const k = Math.min(s.length, 53);
  return s.length - k + Math.log2(parseInt(s.slice(0, k), 2));
}
// steps at sweep nu: exact from the early table while it lasts, then the
// quadratic tail (fit against the exact table; see test harness).
function makeStepLaw(earlyTable, fit) {
  return function (nu) {
    const i = Number(nu);
    if (i < earlyTable.length) return { approx: false, value: earlyTable[i], log10: Math.log10(Math.max(1, earlyTable[i])) };
    const l2 = log2Big(nu);
    const log10 = (2 * l2 + Math.log2(fit.a + fit.b / Math.pow(2, l2))) * Math.LN2 / Math.LN10;
    const mant = Math.pow(10, log10 - Math.floor(log10));
    return { approx: true, log10, text: mant.toFixed(2) + '×10^' + Math.floor(log10) };
  };
}

const OdoEngine = {
  CODE, STATES, parseMachine, makeSim,
  GRAW, TOGGLE, INSTEP, GCELLS, CELL_VAL,
  dip, parseSpell, setSpell, enumerate, stateAt,
  spellAnchor, simFromAnchor, tapeToW, runToAnchor,
  bigFmt, log2Big, makeStepLaw,
};
if (typeof module !== 'undefined' && module.exports) module.exports = OdoEngine;
else globalThis.OdoEngine = OdoEngine;

})();
</script>

    g.fillRect(hx + 1.6, top + 1, cw - 3.2, live - 2);
    g.font = '600 11px ' + F_SANS; g.fillStyle = C.head;
    g.textAlign = 'center'; g.textBaseline = 'bottom';
    g.fillText(E.STATES[r.sim.q], hx + cw / 2, top - 7);
  }

  const sy = top + live + 16, sh = H - sy - 26;
  const rh = Math.max(1.2, Math.min(4.5, sh / 165));   // one sweep ≈ 152 rows ≈ one screenful
  const rows = r.rows, cap = Math.floor(sh / rh);
  const first = Math.max(0, rows.length - cap);
  for (let k = first; k < rows.length; k++) {
    const row = rows[k], y = sy + (k - first) * rh, hd = row[row.length - 1];
    for (let i = 0; i < row.length - 1; i++) {
      if (!row[i]) continue;
      g.fillStyle = C.brass3; g.globalAlpha = 0.34;
      g.fillRect(x0 + i * cw + 0.6, y, cw - 1.2, rh + 0.4);
    }
    g.globalAlpha = 1;
    if (hd) {
      g.fillStyle = C.head; g.globalAlpha = 1;
      g.fillRect(x0 + (hd - 1) * cw + 0.6, y, cw - 1.2, rh + 0.4);
      g.globalAlpha = 1;
    }
  }
  g.strokeStyle = C.rule; g.lineWidth = 1;
  g.beginPath(); g.moveTo(pad, sy - 8.5); g.lineTo(W - pad, sy - 8.5); g.stroke();
  label(g, 'space → · time ↓', pad, H - 13, C.ink3);
  label(g, rows.length + ' of ~152 steps in this sweep', W - pad, H - 13, C.ink3, 9, 'right');
}

// ---------- level 1: glyphs ----------
function dipStart() {
  const r = E.dip(S.W, true);
  const depth = r.ops.length ? Math.max.apply(null, r.ops.map((o) => o.i)) : 0;
  S.dip = { ops: r.ops, k: 0, t: 0, dies: !!r.dies, depth,
            dur: Math.max(6, Math.min(110, 1500 / Math.max(1, r.ops.length))) / 1000 };
  S.dispW = S.W.split('');
  S.depths.push(depth);
  if (S.depths.length > DEPTH_HIST) S.depths.shift();
}
function dipStep(dt) {
  const d = S.dip; if (!d) return;
  d.t += dt;
  while (d.t > d.dur && d.k < d.ops.length) {
    const o = d.ops[d.k++]; d.t -= d.dur;
    if (o.i < S.trail.length) S.trail[o.i] = 1;
    if (o.g2 !== undefined && o.i < S.dispW.length) S.dispW[o.i] = o.g2;
  }
  if (d.k >= d.ops.length && d.t > 0.35) {
    if (d.dies) { die(); return; }
    advanceSweep();
    const nx = nextEvent(S.nu);
    if (nx !== null && S.nu >= nx) leapTo(nx > NU_LAST ? NU_LAST : (nextEvent(nx) || NU_LAST));
    dipStart();
  }
}
const DEPTH_HIST = 220;
function seedDepths() {                     // the run-up to nu, so the chart is never empty
  const start = S.nu > BigInt(DEPTH_HIST) ? S.nu - BigInt(DEPTH_HIST) : 0n;
  const out = [];
  for (let k = start; k < S.nu; k++) {
    const r = E.dip(E.stateAt(k, DATA.W_BASE, ledger), true);
    out.push(r.ops.length ? Math.max.apply(null, r.ops.map((o) => o.i)) : 0);
  }
  S.depths = out;
}
function nextEvent(nu) {
  let lo = 0, hi = EVN.length - 1, k = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (EVN[m] > nu) { k = m; hi = m - 1; } else lo = m + 1; }
  return k < 0 ? null : EVN[k];
}
function leapTo(ev) {
  S.knobFrom = knobX(); S.knobEase = 1;
  const t = ev - 4n;
  setNu(t < 0n ? 0n : t);
  seedDepths();
}

function drawGlyphs(g) {
  const pad = 26, N = S.dispW.length, SLOTS = N + 13;
  const gw = (W - 2 * pad) / SLOTS;
  const xSep = W - pad - 12 * gw;
  const xOf = (i) => xSep - (i + 1) * gw;
  const top = Math.round(H * 0.15), bh = Math.round(H * 0.26);
  const bw = Math.max(1.4, gw - 1.5);

  for (let i = 0; i < S.trail.length && i < N; i++) {
    if (S.trail[i] < 0.02) continue;
    const grd = g2.createLinearGradient(0, top + bh, 0, top + bh + 34);
    grd.addColorStop(0, 'rgba(214,169,79,' + (0.30 * S.trail[i]).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(214,169,79,0)');
    g.fillStyle = grd; g.fillRect(xOf(i) - gw, top + bh, bw + 2 * gw, 34);
  }

  for (let i = 0; i < N; i++) {
    g.fillStyle = GCOL[S.dispW[i]];
    g.fillRect(xOf(i), top, bw, bh);
  }
  for (let k = 0; k < 9; k++) {
    g.fillStyle = GCOL.e; g.globalAlpha = 1 - k * 0.09;
    g.fillRect(xSep + k * gw + 0.7, top, bw, bh);
  }
  g.globalAlpha = 1;
  g.fillStyle = C.ink3;
  for (let k = 0; k < 3; k++) g.fillRect(xSep + (9.6 + k * 0.7) * gw, top + bh / 2, 1.6, 1.6);
  label(g, 'ν+3', W - pad, top + bh + 13, C.ink3, 9, 'right');

  const rule = (x1, x2, y, col, txt) => {
    g.strokeStyle = col; g.lineWidth = 1; g.beginPath();
    g.moveTo(x1, y + 4.5); g.lineTo(x1, y); g.lineTo(x2, y); g.lineTo(x2, y + 4.5); g.stroke();
    if (txt) label(g, txt, (x1 + x2) / 2, y - 8, col, 8.5, 'center');
  };
  if (S.G > 0) rule(xOf(3 * S.G + 1), xOf(2) + bw, top - 14, C.brass2, S.G + ' wheels');
  rule(xOf(N - 1), xOf(2 + 3 * S.G) + bw, top - 14, C.verd2, 'reservoir ' + S.P.T.length);

  const d = S.dip, o = d && d.ops[Math.min(d.k, d.ops.length - 1)];
  if (o) {
    const hx = xOf(o.i) + bw / 2;
    g.strokeStyle = C.head; g.lineWidth = 1; g.globalAlpha = 0.65;
    g.beginPath(); g.moveTo(hx, top - 3); g.lineTo(hx, top + bh + 3); g.stroke();
    g.globalAlpha = 1;
    g.fillStyle = C.head;
    g.beginPath(); g.moveTo(hx, top - 4); g.lineTo(hx - 3.4, top - 10); g.lineTo(hx + 3.4, top - 10); g.fill();
    if (o.s || o.s2) {
      g.font = '600 10px ' + F_SANS; g.textAlign = 'center'; g.textBaseline = 'bottom';
      g.fillText((o.s2 || o.s).replace('r', ''), hx, top - 12);
    }
  }

  const hy = H - 34, hTop = top + bh + 62, hh = hy - hTop;
  if (hh > 40) {
    const hw = (W - 2 * pad) / DEPTH_HIST, base = Math.log(N + 1);
    g.strokeStyle = C.rule; g.lineWidth = 1;
    for (const m of [4, 22, 216]) {
      const yy = Math.round(hy - (Math.log(m + 1) / base) * hh) + 0.5;
      if (yy < hTop + 4) continue;
      g.beginPath(); g.moveTo(pad, yy); g.lineTo(W - pad, yy); g.stroke();
      label(g, String(m), pad + 3, yy - 7, C.ink3, 8);
    }
    S.depths.forEach((dv, i) => {                     // newest at the right
      const bh2 = (Math.log(dv + 1) / base) * hh;
      g.fillStyle = dv > 6 ? C.brass : C.brass2;
      g.globalAlpha = dv > 6 ? 0.95 : 0.6;
      g.fillRect(W - pad - (S.depths.length - i) * hw, hy - bh2, Math.max(1, hw - 0.8), bh2);
    });
    g.globalAlpha = 1;
    g.strokeStyle = C.rule2; g.beginPath();
    g.moveTo(pad, hy + 0.5); g.lineTo(W - pad, hy + 0.5); g.stroke();
    label(g, 'carry depth, last ' + DEPTH_HIST + ' sweeps', pad, hTop - 12, C.ink3);
    label(g, 'now ' + (d ? d.depth : 0), W - pad, hTop - 12, d && d.depth > 6 ? C.brass : C.ink3, 9, 'right');
  }

  const y = H - 14;
  const keys = ['O', 'e', 'a', 'f'], names = ['hollow', 'tail', 'fuel', 'full'];
  keys.forEach((k, i) => {
    const x = pad + i * 74;
    g.fillStyle = GCOL[k]; g.fillRect(x, y - 4, 8, 8);
    label(g, k + ' ' + names[i], x + 13, y, C.ink3, 8.5);
  });
}

// ---------- level 2: wheels ----------
function drawWheels(g) {
  const pad = 34, n = Math.max(S.G, 1);
  const dw = Math.max(9, Math.min((W - 2 * pad) / n, 62));
  const dh = Math.min(H * 0.52, 240), GAP = 62;
  const x0 = (W - dw * n) / 2;
  const top = Math.round(Math.max(38, (H - (dh + GAP + 14)) / 2));
  const fs = Math.min(dw * 0.62, dh * 0.34);

  label(g, 'base-16 counter', pad, 18, C.ink3);
  label(g, S.G + ' wheels', W - pad, 18, C.brass2, 9, 'right');

  if (S.G === 0) {
    label(g, 'no digits yet — laying the reservoir', W / 2, top + dh / 2, C.ink3, 10, 'center');
  }
  for (let g_ = 0; g_ < S.G; g_++) {
    const x = x0 + (S.G - 1 - g_) * dw, blurred = g_ < S.blur;
    const grd = g2.createLinearGradient(0, top, 0, top + dh);
    grd.addColorStop(0, '#0a0d10'); grd.addColorStop(0.14, '#1b2228');
    grd.addColorStop(0.5, '#232c33'); grd.addColorStop(0.86, '#1b2228'); grd.addColorStop(1, '#0a0d10');
    g.fillStyle = grd;
    roundRect(g, x + 1, top, dw - 2, dh, 2); g.fill();
    g.strokeStyle = '#00000060'; g.lineWidth = 1; g.stroke();

    const cy = top + dh / 2;
    g.save();
    roundRect(g, x + 1, top, dw - 2, dh, 2); g.clip();
    g.font = '500 ' + fs.toFixed(1) + 'px ' + F_MONO;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (blurred) {
      const spread = Math.min(dh * 0.42, 30);
      for (let k = -3; k <= 3; k++) {
        g.globalAlpha = 0.13 - Math.abs(k) * 0.014;
        g.fillStyle = C.brass;
        g.fillText(((S.digits[g_] + k + 16) % 16).toString(16).toUpperCase(), x + dw / 2, cy + k * spread / 3);
      }
      g.globalAlpha = 0.5; g.fillStyle = C.brass2;
      g.fillRect(x + dw / 2 - 0.6, top + 6, 1.2, dh - 12);
      g.globalAlpha = 1;
    } else {
      g.globalAlpha = 0.055; g.fillStyle = C.brass;
      g.fillText(((S.digits[g_] + 15) % 16).toString(16).toUpperCase(), x + dw / 2, cy - fs * 1.5);
      g.fillText(((S.digits[g_] + 1) % 16).toString(16).toUpperCase(), x + dw / 2, cy + fs * 1.5);
      g.globalAlpha = 1;
      g.fillStyle = C.brass;
      if (dw > 11) g.fillText(S.digits[g_].toString(16).toUpperCase(), x + dw / 2, cy);
      else { g.fillStyle = C.brass2; g.fillRect(x + 2, cy - 3, dw - 4, 6); }
    }
    const f = S.flash[g_] || 0;
    if (f > 0.01) { g.fillStyle = 'rgba(232,244,255,' + (0.16 * f).toFixed(3) + ')'; g.fillRect(x + 1, top, dw - 2, dh); }
    g.restore();

    g.strokeStyle = 'rgba(214,169,79,' + (0.18 + 0.5 * (S.flash[g_] || 0)).toFixed(3) + ')';
    g.lineWidth = 1; g.beginPath();
    g.moveTo(x + 1.5, top + dh * 0.30); g.lineTo(x + dw - 1.5, top + dh * 0.30);
    g.moveTo(x + 1.5, top + dh * 0.70); g.lineTo(x + dw - 1.5, top + dh * 0.70); g.stroke();
    if (S.G > 3 && dw > 22) {
      if (g_ === 0) label(g, 'ticks each sweep', x + dw / 2, top + dh + 15, C.ink3, 8, 'center');
      if (g_ === S.G - 1) label(g, 'every 16' + sup(S.G - 1), x + dw / 2, top + dh + 15, C.ink3, 8, 'center');
    }
  }

  const ry = Math.min(top + dh + GAP, H - 42), tn = S.P.T.length;
  const rw = Math.min((W - 2 * pad) / T_BASE, 6);
  const rx = (W - rw * T_BASE) / 2;
  label(g, 'reservoir', rx, ry - 15, C.verd2, 8.5);
  label(g, tn + ' of ' + T_BASE + ' blocks · three per wheel', rx + rw * T_BASE, ry - 15, C.verd2, 8.5, 'right');
  for (let i = 0; i < T_BASE; i++) {
    const spent = i < T_BASE - tn;
    g.fillStyle = spent ? '#141a1e' : C.verd;
    g.globalAlpha = spent ? 1 : 0.5 + 0.5 * (i / T_BASE);
    g.fillRect(rx + i * rw, ry, Math.max(1, rw - 1), 14);
  }
  g.globalAlpha = 1;
  if (S.birth > 0.01) {
    g.fillStyle = 'rgba(95,158,142,' + (0.8 * S.birth).toFixed(3) + ')';
    g.fillRect(rx + (T_BASE - tn - 3) * rw, ry - 3, rw * 3, 20);
  }
}

// ---------- level 3: life ----------
const LIFE = (() => {
  const pts = [{ x: E.log2Big(CLOCK_OFF), G: 0 }];
  for (const e of ledger.events) pts.push({ x: E.log2Big(e.nuAfter + CLOCK_OFF), G: E.parseSpell(e.after).G });
  pts.push({ x: L2MAX, G: G_MAX });
  return pts;
})();

function drawLife(g) {
  const L = 54, R = 82, T = 30, B = 42;
  const px = (x) => L + (W - L - R) * (x / L2MAX);
  const py = (v) => H - B - (H - T - B) * (v / G_MAX);

  g.strokeStyle = C.rule; g.lineWidth = 1;
  for (let v = 0; v <= G_MAX; v += 16) {
    g.beginPath(); g.moveTo(L, Math.round(py(v)) + 0.5); g.lineTo(W - R, Math.round(py(v)) + 0.5); g.stroke();
    label(g, String(v), L - 8, py(v), C.ink3, 8.5, 'right');
    label(g, String(T_BASE - 3 * v), W - R + 8, py(v), C.verd2, 8.5);
  }
  label(g, 'wheels', L - 8, T - 8, C.brass2, 8.5, 'right');
  label(g, 'reservoir', W - R + 8, T - 8, C.verd2, 8.5);
  for (let b = 0; b <= 256; b += 64) {
    g.strokeStyle = C.rule; g.beginPath();
    g.moveTo(Math.round(px(b)) + 0.5, T); g.lineTo(Math.round(px(b)) + 0.5, H - B); g.stroke();
    label(g, b === 0 ? '1 sweep' : '2' + sup(b), px(b), H - B + 14, C.ink3, 8.5, 'center');
  }

  g.strokeStyle = C.brass2; g.lineWidth = 0.7; g.globalAlpha = 0.55;
  for (let i = 1; i < LIFE.length - 1; i++) {
    g.beginPath(); g.moveTo(px(LIFE[i].x), py(LIFE[i].G)); g.lineTo(px(LIFE[i].x), py(LIFE[i].G) + 7); g.stroke();
  }
  g.globalAlpha = 1;

  g.strokeStyle = C.brass; g.lineWidth = 1.8; g.lineJoin = 'round'; g.beginPath();
  g.moveTo(px(LIFE[0].x), py(0));
  for (let i = 1; i < LIFE.length; i++) {
    g.lineTo(px(LIFE[i].x), py(LIFE[i - 1].G));
    g.lineTo(px(LIFE[i].x), py(LIFE[i].G));
  }
  g.stroke();

  g.fillStyle = C.halt;
  g.fillRect(Math.round(px(L2MAX)) - 1, T, 2, H - T - B);
  label(g, '3·2' + sup(279), px(L2MAX) - 8, H - B - 12, C.halt, 9, 'right');

  const x = px(l2now());
  g.strokeStyle = C.head; g.lineWidth = 1; g.globalAlpha = 0.5;
  g.beginPath(); g.moveTo(Math.round(x) + 0.5, T); g.lineTo(Math.round(x) + 0.5, H - B); g.stroke();
  g.globalAlpha = 1;
  g.fillStyle = C.head;
  g.beginPath(); g.arc(x, py(S.G), 3.2, 0, 7); g.fill();

  label(g, '549 overflow events · 71 wheels', L, H - 12, C.ink3, 8.5);
  label(g, '≈' + '6.79×10' + sup(169) + ' steps', W - R, H - 12, C.ink3, 8.5, 'right');
}

// ---------- compositor ----------
const DRAW = [drawCells, drawGlyphs, drawWheels, drawLife];
function paint() {
  g2.clearRect(0, 0, W, H);
  const drawOne = (lv, a, s) => {
    if (a <= 0.004) return;
    g2.save(); g2.globalAlpha = a;
    g2.translate(W / 2, H / 2); g2.scale(s, s); g2.translate(-W / 2, -H / 2);
    DRAW[lv](g2); g2.restore();
  };
  if (S.tr < 1 && S.lvOut >= 0) {
    const t = S.tr, d = S.lv > S.lvOut ? 1 : -1;
    drawOne(S.lvOut, 1 - t, 1 + d * 0.07 * t);
    drawOne(S.lv, t, 1 - d * 0.07 * (1 - t));
  } else {
    drawOne(S.lv, 1, 1);
  }
}

// ---------- clock ----------
function die() {
  S.dead = true; S.playing = false; setPlayIcon();
  $('halt').classList.add('on');
  setNu(NU_LAST);
}
function advanceSweep() { if (S.nu < NU_LAST) setNu(S.nu + 1n); else die(); }

function advanceLog(dt) {
  const speed = (S.lv === 3 ? L2MAX / 22 : L2MAX / 52);
  const n2 = l2now() + speed * dt;
  if (n2 >= L2MAX) { die(); return; }
  const nu = big2(n2) - CLOCK_OFF;
  setNu(nu > S.nu ? nu : S.nu + 1n);
  S.blur = Math.max(0, (E.log2Big(S.nu + 1n) + Math.log2(Math.LN2 * speed) - 3) / 4);
}

let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  if (S.tr < 1) S.tr = Math.min(1, S.tr + dt * 4.2);
  for (let i = 0; i < S.trail.length; i++) S.trail[i] *= Math.pow(0.45, dt);
  for (let i = 0; i < S.flash.length; i++) S.flash[i] *= Math.pow(0.02, dt);
  S.birth *= Math.pow(0.06, dt);
  S.knobEase *= Math.pow(0.004, dt);

  if (S.playing && !S.dead) {
    if (S.lv === 0) rawStep(dt);
    else if (S.lv === 1) dipStep(dt);
    else advanceLog(dt);
  }
  if (S.lv !== 2 && S.lv !== 3) S.blur = 0;

  paint(); paintWhen();
  requestAnimationFrame(frame);
}

// ---------- rails ----------
const whenRail = $('whenRail'), knob = $('whenKnob'), zoomRail = $('zoomRail'), ticks = $('whenTicks');
function knobX() { const r = whenRail.getBoundingClientRect(); return (l2now() / L2MAX) * r.width; }
function paintWhen() {
  const x = knobX();
  knob.style.left = (S.knobEase > 0.01 ? S.knobFrom + (x - S.knobFrom) * (1 - S.knobEase) : x) + 'px';
}
function layoutRails() {
  const r = whenRail.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  ticks.width = Math.max(1, Math.round(r.width * d)); ticks.height = Math.round(26 * d);
  const g = ticks.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, r.width, 26);
  g.fillStyle = C.brass2;
  for (const e of EVN) g.fillRect((E.log2Big(e + CLOCK_OFF) / L2MAX) * r.width, 13, 1, 5);
}
function seekFromClient(cx) {
  const r = whenRail.getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (cx - r.left) / r.width));
  S.dead = false; $('halt').classList.remove('on');
  setNu(big2(f * L2MAX) - CLOCK_OFF, true);
  if (S.lv === 0) rawStart(); else if (S.lv === 1) { seedDepths(); dipStart(); }
}
let dragging = false;
whenRail.addEventListener('pointerdown', (e) => { dragging = true; whenRail.setPointerCapture(e.pointerId); seekFromClient(e.clientX); });
whenRail.addEventListener('pointermove', (e) => { if (dragging) seekFromClient(e.clientX); });
whenRail.addEventListener('pointerup', () => { dragging = false; });
whenRail.addEventListener('keydown', (e) => {
  const d = e.key === 'ArrowRight' ? 4 : e.key === 'ArrowLeft' ? -4 : 0;
  if (!d) return; e.preventDefault();
  const r = whenRail.getBoundingClientRect();
  seekFromClient(r.left + r.width * Math.max(0, Math.min(1, (l2now() + d) / L2MAX)));
});

LEVELS.forEach((L, i) => {
  const el = document.createElement('div');
  el.className = 'det'; el.dataset.i = i;
  el.style.left = (LEVELS.length === 1 ? 50 : (6 + i * (88 / (LEVELS.length - 1)))) + '%';
  el.innerHTML = '<i></i>' + L.key;
  el.addEventListener('click', () => setLevel(i));
  zoomRail.appendChild(el);
});
function setLevel(i) {
  if (i === S.lv || i < 0 || i >= LEVELS.length) return;
  S.lvOut = S.lv; S.lv = i; S.tr = 0;
  [...zoomRail.children].forEach((el, k) => el.classList.toggle('on', k === i));
  $('caption').innerHTML = LEVELS[i].cap;
  if (i === 0) rawStart();
  if (i === 1) { const nx = nextEvent(S.nu); if (nx !== null) leapTo(nx); seedDepths(); dipStart(); }
}
zoomRail.addEventListener('keydown', (e) => {
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (d) { e.preventDefault(); setLevel(S.lv + d); }
});
addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key >= '1' && e.key <= '4') setLevel(+e.key - 1);
});

// ---------- transport ----------
function setPlayIcon() {
  $('playIcon').innerHTML = S.playing
    ? '<path d="M3.5 2h3.5v12H3.5zM9 2h3.5v12H9z"/>'
    : '<path d="M3 1.5 14 8 3 14.5Z"/>';
}
function toggle() {
  if (S.dead) { S.dead = false; $('halt').classList.remove('on'); setNu(0n, true); }
  S.playing = !S.playing; setPlayIcon();
  if (S.playing) { if (S.lv === 0) rawStart(); if (S.lv === 1 && !S.dip) dipStart(); }
}
